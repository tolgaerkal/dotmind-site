<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 500" role="img" aria-label="A mistake must get past five safety nets to harm a resident" font-size="13"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="nets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A9A69C"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#121417">A mistake must get past five safety nets to harm a resident</text><g fill="none" stroke="#A9A69C" stroke-width="1.25"><path d="M380 124V148" marker-end="url(#nets-arrow)"></path><path d="M380 212V236" marker-end="url(#nets-arrow)"></path><path d="M380 300V324" marker-end="url(#nets-arrow)"></path><path d="M380 388V412" marker-end="url(#nets-arrow)"></path></g><g><rect x="80" y="60" width="600" height="64" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="100" y="86" font-weight="600" fill="#121417">1. Limited access</text><text x="100" y="107" font-size="11.5" fill="#57554F">The agent can only reach what its task needs; anything else is refused.</text></g><g><rect x="80" y="148" width="600" height="64" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="100" y="174" font-weight="600" fill="#121417">2. Evidence on every flag</text><text x="100" y="195" font-size="11.5" fill="#57554F">Each finding links to the page and the rule, so errors are easy to spot.</text></g><g><rect x="80" y="236" width="600" height="64" rx="8" fill="#C2410C" fill-opacity="0.12" stroke="#C2410C" stroke-width="2"></rect><text x="100" y="262" font-weight="600" fill="#121417">3. Staff review</text><text x="100" y="283" font-size="11.5" fill="#121417">A person checks the agent’s work and makes every decision.</text></g><g><rect x="80" y="324" width="600" height="64" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="100" y="350" font-weight="600" fill="#121417">4. Reasons and appeal</text><text x="100" y="371" font-size="11.5" fill="#57554F">Residents see why, and can ask a person to review the outcome.</text></g><g><rect x="80" y="412" width="600" height="64" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="100" y="438" font-weight="600" fill="#121417">5. Monitoring and pause</text><text x="100" y="459" font-size="11.5" fill="#57554F">Overrides and appeals are tracked, and an agent can be paused at once.</text></g></svg>
