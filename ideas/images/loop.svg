<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="An agent loops until a person needs to decide" font-size="13"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A9A69C"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#121417">An agent loops until a person needs to decide</text><g fill="none" stroke="#A9A69C" stroke-width="1.25"><path d="M170 118H200" marker-end="url(#loop-arrow)"></path><path d="M340 118H370" marker-end="url(#loop-arrow)"></path><path d="M510 118H540" marker-end="url(#loop-arrow)"></path><path d="M610 94V66H270V94" marker-end="url(#loop-arrow)"></path><path d="M610 142V222" marker-end="url(#loop-arrow)"></path><path d="M540 246H470" marker-end="url(#loop-arrow)"></path></g><g><rect x="30" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="100" y="122" text-anchor="middle" fill="#121417">Set the goal</text></g><g><rect x="200" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="270" y="122" text-anchor="middle" fill="#121417">Plan next step</text></g><g><rect x="370" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="440" y="122" text-anchor="middle" fill="#121417">Act with a tool</text></g><g><rect x="540" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#A9A69C" stroke-width="1.25"></rect><text x="610" y="122" text-anchor="middle" fill="#121417">Check the result</text></g><g><rect x="540" y="222" width="140" height="48" rx="8" fill="#C2410C" fill-opacity="0.12" stroke="#C2410C" stroke-width="2"></rect><text x="610" y="250" text-anchor="middle" f