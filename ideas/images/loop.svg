<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 296" role="img" aria-label="An agent loops until a person needs to decide" font-size="13"><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8A82"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#0D0D0D">An agent loops until a person needs to decide</text><g fill="none" stroke="#8A8A82" stroke-width="1.25"><path d="M170 118H200" marker-end="url(#loop-arrow)"></path><path d="M340 118H370" marker-end="url(#loop-arrow)"></path><path d="M510 118H540" marker-end="url(#loop-arrow)"></path><path d="M610 94V66H270V94" marker-end="url(#loop-arrow)"></path><path d="M610 142V222" marker-end="url(#loop-arrow)"></path><path d="M540 246H470" marker-end="url(#loop-arrow)"></path></g><g><rect x="30" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8A8A82" stroke-width="1.25"></rect><text x="100" y="122" text-anchor="middle" fill="#0D0D0D">Set the goal</text></g><g><rect x="200" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8A8A82" stroke-width="1.25"></rect><text x="270" y="122" text-anchor="middle" fill="#0D0D0D">Plan next step</text></g><g><rect x="370" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8A8A82" stroke-width="1.25"></rect><text x="440" y="122" text-anchor="middle" fill="#0D0D0D">Act with a tool</text></g><g><rect x="540" y="94" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8A8A82" stroke-width="1.25"></rect><text x="610" y="122" text-anchor="middle" fill="#0D0D0D">Check the result</text></g><g><rect x="540" y="222" width="140" height="48" rx="8" fill="#4338CA" fill-opacity="0.12" stroke="#4338CA" stroke-width="2"></rect><text x="610" y="250" text-anchor="middle" font-weight="600" fill="#0D0D0D">Person decides</text></g><g><rect x="330" y="222" width="140" height="48" rx="8" fill="none" fill-opacity="1" stroke="#8A8A82" stroke-width="1.25"></rect><text x="400" y="250" text-anchor="middle" fill="#0D0D0D">Outcome shared</text></g><text x="440" y="58" text-anchor="middle" font-size="11.5" fill="#45453F">more to do</text><text x="620" y="186" font-size="11.5" fill="#45453F">ready for a decision</text></svg>
